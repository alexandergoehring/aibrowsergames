<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2c3e50;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  canvas { display: block; }

  /* Overlay-Screens (Start / Game Over) */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.55);
    z-index: 10;
    transition: opacity 0.3s;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    color: #f1c40f;
    font-size: 48px;
    text-shadow: 3px 3px 0 #e67e22, 6px 6px 0 rgba(0,0,0,0.3);
    margin-bottom: 12px;
  }
  .overlay p {
    color: #ecf0f1;
    font-size: 18px;
    margin-bottom: 28px;
  }
  .overlay .score-display {
    color: #fff;
    font-size: 28px;
    margin-bottom: 24px;
  }
  .overlay .score-display span { color: #f1c40f; font-weight: bold; }
  .btn {
    padding: 14px 48px;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    box-shadow: 0 6px 0 #1e8449, 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
    outline: none;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #1e8449, 0 10px 24px rgba(0,0,0,0.35); }
  .btn:active { transform: translateY(2px); box-shadow: 0 3px 0 #1e8449, 0 4px 12px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- Start-Screen -->
  <div id="startScreen" class="overlay">
    <h1>Flappy Bird</h1>
    <p>Klicke oder drücke Leertaste zum Fliegen</p>
    <button class="btn" id="startBtn">Start</button>
  </div>

  <!-- Game-Over-Screen -->
  <div id="gameOverScreen" class="overlay hidden">
    <h1>Game Over</h1>
    <div class="score-display">Score: <span id="finalScore">0</span></div>
    <div class="score-display">Best: <span id="bestScore">0</span></div>
    <button class="btn" id="restartBtn">Nochmal</button>
  </div>
</div>

<script>
// ==========================================
//  KONFIGURATION – Hier Werte anpassen!
// ==========================================
const CONFIG = {
  // Canvas
  WIDTH: 400,
  HEIGHT: 600,

  // Schwerkraft & Sprung
  GRAVITY: 0.45,         // Schwerkraft pro Frame (höher = schneller fallen)
  JUMP_FORCE: -7.5,      // Sprungkraft (negativer = höher springen)
  MAX_FALL_SPEED: 10,    // Max. Fallgeschwindigkeit

  // Vogel
  BIRD_SIZE: 28,          // Radius des Vogels
  BIRD_X: 80,             // Horizontale Position des Vogels

  // Röhren
  PIPE_WIDTH: 60,         // Breite der Röhren
  PIPE_GAP: 150,          // Lücke zwischen oberer und unterer Röhre (kleiner = schwerer)
  PIPE_SPEED: 2.8,        // Geschwindigkeit der Röhren (höher = schwerer)
  PIPE_SPAWN_INTERVAL: 90, // Frames zwischen neuen Röhren (kleiner = mehr Röhren)
  PIPE_MIN_HEIGHT: 60,    // Min. Höhe einer Röhre

  // Boden
  GROUND_HEIGHT: 80,

  // Farben
  SKY_TOP: '#87CEEB',
  SKY_BOTTOM: '#E0F0FF',
  GROUND_COLOR: '#8B6914',
  GROUND_GRASS: '#4CAF50',
  PIPE_COLOR: '#2E7D32',
  PIPE_HIGHLIGHT: '#43A047',
  PIPE_DARK: '#1B5E20',
  BIRD_BODY: '#FDD835',
  BIRD_WING: '#F9A825',
  BIRD_EYE: '#fff',
  BIRD_PUPIL: '#333',
  BIRD_BEAK: '#FF8F00',
};

// ==========================================
//  SPIELVARIABLEN
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CONFIG.WIDTH;
canvas.height = CONFIG.HEIGHT;

const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const bestScoreEl = document.getElementById('bestScore');

let bird, pipes, score, bestScoreVal, frameCount, gameRunning, gameStarted;

// ==========================================
//  INITIALISIERUNG
// ==========================================
function init() {
  bird = {
    x: CONFIG.BIRD_X,
    y: CONFIG.HEIGHT / 2.5,
    vy: 0,                     // Vertikale Geschwindigkeit
    rotation: 0,               // Neigung des Vogels
    flapFrame: 0,              // Animation
  };
  pipes = [];
  score = 0;
  frameCount = 0;
  gameRunning = false;
  gameStarted = false;
  bestScoreVal = bestScoreVal || 0;
}

init();

// ==========================================
//  STEUERUNG
// ==========================================
function flap() {
  if (!gameRunning) return;
  bird.vy = CONFIG.JUMP_FORCE;
  bird.flapFrame = 8; // Flügelanimation Frames
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

function startGame() {
  init();
  gameRunning = true;
  gameStarted = true;
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  // Erster Sprung
  bird.vy = CONFIG.JUMP_FORCE * 0.6;
  requestAnimationFrame(gameLoop);
}

// ==========================================
//  GAME LOOP
// ==========================================
function gameLoop() {
  update();
  draw();
  if (gameRunning) {
    requestAnimationFrame(gameLoop);
  }
}

// ==========================================
//  UPDATE-LOGIK
// ==========================================
function update() {
  frameCount++;

  // Schwerkraft anwenden
  bird.vy += CONFIG.GRAVITY;
  if (bird.vy > CONFIG.MAX_FALL_SPEED) bird.vy = CONFIG.MAX_FALL_SPEED;
  bird.y += bird.vy;

  // Vogelrotation basierend auf Geschwindigkeit
  bird.rotation = Math.min(bird.vy * 4, 70) * (Math.PI / 180);
  if (bird.flapFrame > 0) bird.flapFrame--;

  // Neue Röhren spawnen
  if (frameCount % CONFIG.PIPE_SPAWN_INTERVAL === 0) {
    const playArea = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT - CONFIG.PIPE_GAP - CONFIG.PIPE_MIN_HEIGHT * 2;
    const topHeight = CONFIG.PIPE_MIN_HEIGHT + Math.random() * playArea;
    pipes.push({
      x: CONFIG.WIDTH,
      topH: topHeight,
      bottomY: topHeight + CONFIG.PIPE_GAP,
      scored: false,
    });
  }

  // Röhren bewegen & Score zählen
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= CONFIG.PIPE_SPEED;

    // Score: Röhre passiert?
    if (!pipes[i].scored && pipes[i].x + CONFIG.PIPE_WIDTH < bird.x) {
      pipes[i].scored = true;
      score++;
    }

    // Röhre aus dem Bildschirm? Entfernen.
    if (pipes[i].x + CONFIG.PIPE_WIDTH < -10) {
      pipes.splice(i, 1);
    }
  }

  // Kollisionsabfrage
  checkCollisions();
}

// ==========================================
//  KOLLISIONEN
// ==========================================
function checkCollisions() {
  const r = CONFIG.BIRD_SIZE * 0.7; // Etwas kleinerer Hitbox-Radius für Fairness
  const bx = bird.x;
  const by = bird.y;

  // Boden
  if (by + r >= CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT) {
    gameOver();
    return;
  }
  // Decke
  if (by - r <= 0) {
    bird.y = r;
    bird.vy = 0;
  }

  // Röhren (Rechteck vs. Kreis)
  for (const pipe of pipes) {
    const px = pipe.x;
    const pw = CONFIG.PIPE_WIDTH;

    // Obere Röhre
    if (circleRect(bx, by, r, px, 0, pw, pipe.topH)) {
      gameOver();
      return;
    }
    // Untere Röhre
    const bottomH = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT - pipe.bottomY;
    if (circleRect(bx, by, r, px, pipe.bottomY, pw, bottomH)) {
      gameOver();
      return;
    }
  }
}

// Kreis-Rechteck-Kollision
function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (cr * cr);
}

function gameOver() {
  gameRunning = false;
  if (score > bestScoreVal) bestScoreVal = score;
  finalScoreEl.textContent = score;
  bestScoreEl.textContent = bestScoreVal;
  gameOverScreen.classList.remove('hidden');
}

// ==========================================
//  ZEICHNEN
// ==========================================
function draw() {
  // Himmel (Gradient)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT);
  skyGrad.addColorStop(0, CONFIG.SKY_TOP);
  skyGrad.addColorStop(1, CONFIG.SKY_BOTTOM);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

  // Wolken (dekorativ)
  drawClouds();

  // Röhren
  for (const pipe of pipes) {
    drawPipe(pipe);
  }

  // Boden
  drawGround();

  // Vogel
  drawBird();

  // Score (im Spiel)
  if (gameRunning || !gameStarted) {
    drawScore();
  }
}

function drawPipe(pipe) {
  const pw = CONFIG.PIPE_WIDTH;
  const capH = 26;
  const capExtra = 6;

  // --- Obere Röhre ---
  // Körper
  ctx.fillStyle = CONFIG.PIPE_COLOR;
  ctx.fillRect(pipe.x, 0, pw, pipe.topH);
  // Highlight-Streifen
  ctx.fillStyle = CONFIG.PIPE_HIGHLIGHT;
  ctx.fillRect(pipe.x + 6, 0, 10, pipe.topH);
  // Schatten-Streifen
  ctx.fillStyle = CONFIG.PIPE_DARK;
  ctx.fillRect(pipe.x + pw - 10, 0, 8, pipe.topH);
  // Kappe
  ctx.fillStyle = CONFIG.PIPE_COLOR;
  ctx.fillRect(pipe.x - capExtra, pipe.topH - capH, pw + capExtra * 2, capH);
  ctx.fillStyle = CONFIG.PIPE_HIGHLIGHT;
  ctx.fillRect(pipe.x - capExtra + 4, pipe.topH - capH, 10, capH);
  // Rand
  ctx.strokeStyle = CONFIG.PIPE_DARK;
  ctx.lineWidth = 2;
  ctx.strokeRect(pipe.x - capExtra, pipe.topH - capH, pw + capExtra * 2, capH);

  // --- Untere Röhre ---
  const bottomTop = pipe.bottomY;
  const bottomH = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT - bottomTop;
  // Körper
  ctx.fillStyle = CONFIG.PIPE_COLOR;
  ctx.fillRect(pipe.x, bottomTop, pw, bottomH);
  // Highlight
  ctx.fillStyle = CONFIG.PIPE_HIGHLIGHT;
  ctx.fillRect(pipe.x + 6, bottomTop, 10, bottomH);
  // Schatten
  ctx.fillStyle = CONFIG.PIPE_DARK;
  ctx.fillRect(pipe.x + pw - 10, bottomTop, 8, bottomH);
  // Kappe
  ctx.fillStyle = CONFIG.PIPE_COLOR;
  ctx.fillRect(pipe.x - capExtra, bottomTop, pw + capExtra * 2, capH);
  ctx.fillStyle = CONFIG.PIPE_HIGHLIGHT;
  ctx.fillRect(pipe.x - capExtra + 4, bottomTop, 10, capH);
  ctx.strokeStyle = CONFIG.PIPE_DARK;
  ctx.strokeRect(pipe.x - capExtra, bottomTop, pw + capExtra * 2, capH);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  const s = CONFIG.BIRD_SIZE;

  // Körper
  ctx.fillStyle = CONFIG.BIRD_BODY;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#F57F17';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Bauch (heller)
  ctx.fillStyle = '#FFF176';
  ctx.beginPath();
  ctx.arc(2, 6, s * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // Flügel
  ctx.fillStyle = CONFIG.BIRD_WING;
  const wingY = bird.flapFrame > 0 ? -10 : 2;
  ctx.beginPath();
  ctx.ellipse(-6, wingY, s * 0.65, s * 0.35, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Auge
  ctx.fillStyle = CONFIG.BIRD_EYE;
  ctx.beginPath();
  ctx.arc(12, -8, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Pupille
  ctx.fillStyle = CONFIG.BIRD_PUPIL;
  ctx.beginPath();
  ctx.arc(15, -7, 4, 0, Math.PI * 2);
  ctx.fill();

  // Glanzpunkt im Auge
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(16.5, -9, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Schnabel
  ctx.fillStyle = CONFIG.BIRD_BEAK;
  ctx.beginPath();
  ctx.moveTo(s - 2, -2);
  ctx.lineTo(s + 16, 2);
  ctx.lineTo(s - 2, 8);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawGround() {
  const gy = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT;

  // Gras-Streifen
  ctx.fillStyle = CONFIG.GROUND_GRASS;
  ctx.fillRect(0, gy, CONFIG.WIDTH, 14);

  // Erd-Boden
  ctx.fillStyle = CONFIG.GROUND_COLOR;
  ctx.fillRect(0, gy + 14, CONFIG.WIDTH, CONFIG.GROUND_HEIGHT - 14);

  // Gras-Muster
  ctx.strokeStyle = '#388E3C';
  ctx.lineWidth = 2;
  for (let x = 0; x < CONFIG.WIDTH; x += 20) {
    const offset = ((frameCount * 1.5 + x) % CONFIG.WIDTH);
    ctx.beginPath();
    ctx.moveTo(CONFIG.WIDTH - offset, gy);
    ctx.lineTo(CONFIG.WIDTH - offset + 6, gy + 10);
    ctx.stroke();
  }

  // Obere Kante
  ctx.strokeStyle = '#33691E';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, gy);
  ctx.lineTo(CONFIG.WIDTH, gy);
  ctx.stroke();
}

// Einfache dekorative Wolken
const clouds = [
  { x: 50, y: 60, w: 80, h: 30 },
  { x: 200, y: 100, w: 100, h: 35 },
  { x: 320, y: 40, w: 70, h: 25 },
];
function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (const c of clouds) {
    const cx = (c.x - frameCount * 0.15 % CONFIG.WIDTH + CONFIG.WIDTH) % (CONFIG.WIDTH + c.w * 2) - c.w;
    ctx.beginPath();
    ctx.ellipse(cx, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - c.w * 0.25, c.y + 5, c.w * 0.35, c.h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + c.w * 0.25, c.y + 3, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawScore() {
  ctx.save();
  ctx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  // Schatten
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText(score, CONFIG.WIDTH / 2 + 3, 68 + 3);
  // Weißer Text mit Outline
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 5;
  ctx.strokeText(score, CONFIG.WIDTH / 2, 68);
  ctx.fillStyle = '#fff';
  ctx.fillText(score, CONFIG.WIDTH / 2, 68);
  ctx.restore();
}

// Zeichne initialen Screen
draw();
</script>
</body>
</html>
