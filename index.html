<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Browsergames Catalog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === ANIMATED BACKGROUND GRID === */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(rgba(255,120,20,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,120,20,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { transform: perspective(500px) rotateX(0deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(0deg) translateY(60px); }
  }

  /* === BANNER === */
  .banner {
    position: relative;
    width: 100%;
    padding: 50px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 1;
  }

  .banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center top, rgba(255,120,20,0.2) 0%, rgba(30,80,220,0.12) 50%, transparent 80%);
    animation: bgPulse 4s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.7; }
    100% { opacity: 1; }
  }

  .banner::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #ff7814, #1e6aff, #ff7814, transparent);
    box-shadow: 0 0 20px #ff7814, 0 0 40px rgba(30,106,255,0.5);
    animation: borderPulse 2s ease-in-out infinite alternate;
  }

  @keyframes borderPulse {
    0% { box-shadow: 0 0 15px #ff7814, 0 0 30px rgba(30,106,255,0.4); }
    100% { box-shadow: 0 0 35px #ff7814, 0 0 60px rgba(30,106,255,0.7), 0 0 80px rgba(255,120,20,0.3); }
  }

  /* === NEON LOGO SVG === */
  .logo-container {
    position: relative;
    z-index: 2;
    margin-bottom: 15px;
    animation: logoFloat 5s ease-in-out infinite;
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.03); }
  }

  .logo-container svg {
    filter: drop-shadow(0 0 15px rgba(255,120,20,0.8)) drop-shadow(0 0 30px rgba(30,106,255,0.5));
    width: 320px;
    height: auto;
    animation: logoGlow 3s ease-in-out infinite alternate;
  }

  @keyframes logoGlow {
    0% { filter: drop-shadow(0 0 10px rgba(255,120,20,0.6)) drop-shadow(0 0 20px rgba(30,106,255,0.3)); }
    100% { filter: drop-shadow(0 0 25px rgba(255,120,20,1)) drop-shadow(0 0 50px rgba(30,106,255,0.8)) drop-shadow(0 0 70px rgba(255,170,68,0.3)); }
  }

  .neon-text-main {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ff7814 0%, #ffaa44 40%, #1e6aff 70%, #66aaff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    position: relative;
    z-index: 2;
    animation: textGlow 3s ease-in-out infinite alternate, gradientShift 6s ease-in-out infinite;
  }

  @keyframes textGlow {
    0% { filter: drop-shadow(0 0 8px rgba(255,120,20,0.6)); }
    50% { filter: drop-shadow(0 0 15px rgba(255,170,68,0.7)); }
    100% { filter: drop-shadow(0 0 25px rgba(30,106,255,0.9)) drop-shadow(0 0 40px rgba(255,120,20,0.4)); }
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .neon-subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,170,68,0.7);
    margin-top: 8px;
    z-index: 2;
    position: relative;
    animation: subtitlePulse 4s ease-in-out infinite alternate;
  }

  @keyframes subtitlePulse {
    0% { color: rgba(255,170,68,0.5); letter-spacing: 8px; }
    100% { color: rgba(255,170,68,0.9); letter-spacing: 10px; }
  }

  /* === FLOATING PARTICLES === */
  .particles {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particleFloat linear infinite;
    opacity: 0;
  }

  .particle.spark {
    animation: sparkFloat linear infinite;
  }

  @keyframes particleFloat {
    0% { transform: translateY(100%) translateX(0) scale(0.5); opacity: 0; }
    10% { opacity: 0.9; transform: translateY(80%) translateX(10px) scale(1); }
    50% { opacity: 1; transform: translateY(40%) translateX(-20px) scale(1.2); }
    90% { opacity: 0.7; transform: translateY(5%) translateX(30px) scale(0.8); }
    100% { transform: translateY(-10%) translateX(40px) scale(0.3); opacity: 0; }
  }

  @keyframes sparkFloat {
    0% { transform: translateY(50%) translateX(0) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: translateY(-20%) translateX(60px) rotate(180deg); opacity: 0.8; }
    85% { opacity: 0.5; }
    100% { transform: translateY(-80%) translateX(-30px) rotate(360deg); opacity: 0; }
  }

  /* === HORIZONTAL LASER LINE === */
  .laser-line {
    position: absolute;
    width: 100%;
    height: 1px;
    top: 50%;
    left: -100%;
    background: linear-gradient(90deg, transparent, #ff7814, #ffaa44, #1e6aff, transparent);
    box-shadow: 0 0 8px #ff7814, 0 0 15px rgba(30,106,255,0.5);
    opacity: 0.6;
    animation: laserSweep 6s linear infinite;
    pointer-events: none;
    z-index: 1;
  }

  .laser-line:nth-child(2) {
    top: 30%;
    animation: laserSweep 8s linear infinite 2s;
    opacity: 0.3;
  }

  .laser-line:nth-child(3) {
    top: 70%;
    animation: laserSweep 7s linear infinite 4s;
    opacity: 0.4;
  }

  @keyframes laserSweep {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  /* === MAIN CONTENT === */
  .container {
    position: relative;
    z-index: 1;
    max-width: 1300px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
  }

  .section-header .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,120,20,0.5), transparent);
  }

  .section-header .line.right {
    background: linear-gradient(90deg, transparent, rgba(30,106,255,0.5));
  }

  .section-header h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    letter-spacing: 4px;
    color: #ffaa44;
    white-space: nowrap;
  }

  /* === STATS BAR === */
  .stats-bar {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .stat-item {
    text-align: center;
    padding: 15px 30px;
    border: 1px solid rgba(255,120,20,0.2);
    border-radius: 8px;
    background: rgba(255,120,20,0.03);
    min-width: 150px;
  }

  .stat-item .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: #ff7814;
    text-shadow: 0 0 10px rgba(255,120,20,0.4);
  }

  .stat-item .label {
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
  }

  /* === GAME CARDS === */
  .games-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .game-card {
    background: linear-gradient(135deg, rgba(30,30,55,0.95), rgba(38,38,65,0.95));
    border: 1px solid rgba(255,120,20,0.12);
    border-radius: 12px;
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 120px 1fr 150px;
    grid-template-rows: auto auto;
    gap: 8px 24px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #ff7814, #1e6aff);
    border-radius: 4px 0 0 4px;
    opacity: 0.6;
    transition: opacity 0.3s;
  }

  .game-card:hover {
    border-color: rgba(255,120,20,0.35);
    box-shadow: 0 0 30px rgba(255,120,20,0.08), inset 0 0 30px rgba(30,106,255,0.03);
    transform: translateX(4px);
  }

  .game-card:hover::before {
    opacity: 1;
  }

  .game-date {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.05rem;
    color: #1e6aff;
    text-shadow: 0 0 8px rgba(30,106,255,0.3);
    padding-top: 4px;
    grid-row: 1 / 3;
    align-self: start;
  }

  .game-title-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  .game-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.45rem;
    font-weight: 700;
    color: #ffaa44;
  }

  .game-ai {
    font-size: 1rem;
    padding: 4px 14px;
    border-radius: 20px;
    background: rgba(30,106,255,0.15);
    border: 1px solid rgba(30,106,255,0.3);
    color: #66aaff;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .game-link {
    grid-row: 1 / 3;
    align-self: center;
    justify-self: end;
  }

  .game-link a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border: 1px solid rgba(255,120,20,0.4);
    border-radius: 8px;
    color: #ff7814;
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.3s;
    background: rgba(255,120,20,0.05);
  }

  .game-link a:hover {
    background: rgba(255,120,20,0.15);
    box-shadow: 0 0 20px rgba(255,120,20,0.2);
    border-color: #ff7814;
  }

  .game-link a svg {
    width: 16px; height: 16px;
    fill: currentColor;
  }

  .game-details {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .game-prompt {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.65;
  }

  .game-prompt strong {
    color: rgba(255,170,68,0.7);
    font-weight: 600;
  }

  .game-notes {
    font-size: 1.05rem;
    color: rgba(30,150,255,0.7);
    font-style: italic;
    line-height: 1.6;
  }

  .game-notes strong {
    color: rgba(30,150,255,0.8);
    font-weight: 600;
    font-style: normal;
  }

  /* === NAV LINKS === */
  .game-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    justify-content: center;
    margin-bottom: 40px;
    padding: 20px 24px;
    border: 1px solid rgba(255,120,20,0.12);
    border-radius: 12px;
    background: rgba(30,30,55,0.7);
  }

  .game-nav a {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    color: #ffaa44;
    text-decoration: none;
    padding: 8px 18px;
    border: 1px solid rgba(255,120,20,0.2);
    border-radius: 6px;
    background: rgba(255,120,20,0.04);
    transition: all 0.3s;
    white-space: nowrap;
  }

  .game-nav a:hover {
    background: rgba(255,120,20,0.12);
    border-color: rgba(255,120,20,0.5);
    box-shadow: 0 0 12px rgba(255,120,20,0.15);
    color: #ff7814;
  }

  /* === FOOTER === */
  .footer {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
  }

  .footer::before {
    content: '';
    display: block;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,120,20,0.3), transparent);
    margin: 0 auto 20px;
  }

  /* === RESPONSIVE === */
  @media (max-width: 800px) {
    .neon-text-main { font-size: 1.5rem; letter-spacing: 3px; }
    .game-card {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      gap: 12px;
    }
    .game-date { grid-row: auto; }
    .game-link { grid-row: auto; justify-self: start; }
    .game-details { grid-column: 1; }
    .stats-bar { gap: 12px; }
    .stat-item { min-width: 120px; padding: 12px 18px; }
  }

  /* === SCANLINE EFFECT === */
  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
  }
</style>
</head>

      <!-- Buttons -->
      <circle cx="195" cy="30" r="3" fill="#1e6aff" opacity="0.9" filter="url(#glow)">

      <!-- Connection lines from chip -->
      <line x1="150" y1="42" x2="143" y2="42" stroke="#ffaa44" stroke-width="0.8" opacity="0.4"/>

      <line x1="170" y1="42" x2="177" y2="42" stroke="#ffaa44" stroke-width="0.8" opacity="0.4"/>
      <line x1="170" y1="48" x2="177" y2="48" stroke="#ffaa44" stroke-width="0.8" opacity="0.4"/>
    </svg>
  </div>

  <h1 class="neon-text-main">AI Browsergames</h1>
  <p class="neon-subtitle">Catalog &mdash; Generated by AI</p>
</header>

<!-- ===== STATS ===== -->
<div class="container">
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <div class="value" id="totalGames">0</div>

  <!-- ===== NAV LINKS ===== -->

  <div class="section-header">

  <!-- ===== GAME LIST ===== -->
  <div class="games-grid" id="gamesGrid"></div>

// ===== HELPER: slug from name =====
function toSlug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

// ===== RENDER NAV =====
function renderNav() {
  const nav = document.getElementById('gameNav');
  nav.innerHTML = '';
  games.forEach(game => {
    const a = document.createElement('a');
    a.href = '#' + toSlug(game.name);
    a.textContent = game.name;
    nav.appendChild(a);
  });
}

// ===== RENDER GAMES =====
function renderGames() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';

  games.forEach((game, i) => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.id = toSlug(game.name);
    card.style.animationDelay = (i * 0.08) + 's';
    card.style.scrollMarginTop = '20px';
    card.innerHTML = `
      <div class="game-date">${game.date}</div>
      <div class="game-title-row">
        <span class="game-name">${game.name}</span>
        <span class="game-ai">${game.ai}</span>
      </div>
      <div class="game-link">
        <a href="${game.link}">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Spielen
        </a>
      </div>
      <div class="game-details">
        <div class="game-prompt"><strong>Prompt:</strong> ${game.prompt}</div>
        ${game.notes ? `<div class="game-notes"><strong>Anmerkung:</strong> ${game.notes}</div>` : ''}
      </div>
    `;
    grid.appendChild(card);
  });

  // Update stats
  document.getElementById('totalGames').textContent = games.length;
  const uniqueAIs = [...new Set(games.map(g => g.ai))];
  document.getElementById('totalAIs').textContent = uniqueAIs.length;
  if (games.length > 0) {
    const dates = games.map(g => g.date);
    document.getElementById('dateRange').textContent = dates[dates.length - 1] + ' \u2013 ' + dates[0];
  }
}

// ===== PARTICLES =====
function createParticles() {
  const container = document.getElementById('particles');
  const colors = ['#ff7814', '#ffaa44', '#1e6aff', '#66aaff', '#ff9944', '#4488ff'];
  // Regular floating particles
  for (let i = 0; i < 50; i++) {
    const p = document.createElement('div');
    const isSpark = Math.random() > 0.6;
    p.className = isSpark ? 'particle spark' : 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (3 + Math.random() * 7) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    const size = isSpark ? (1 + Math.random() * 2) : (2 + Math.random() * 4);
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    if (!isSpark) {
      p.style.boxShadow = `0 0 ${4 + Math.random() * 8}px ${p.style.backgroundColor}`;
    }
    container.appendChild(p);
  }
}

// ===== INIT =====
renderNav();
renderGames();
createParticles();
</script>
</body>
</html>
