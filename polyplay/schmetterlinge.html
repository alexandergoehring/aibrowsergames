<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Schmetterlinge – Polyplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="polyplay.css">
</head>
<body>
<main class="cabinet">
  <header class="marquee">
    <a class="logo" href="index.html" title="Zur Spielauswahl">poly<span>·</span>play</a>
    <span class="game-name">Schmetterlinge</span>
  </header>
  <div class="screen-wrap" id="wrap">
    <canvas id="screen" width="320" height="240" aria-label="Spielfeld Schmetterlinge"></canvas>
  </div>
  <div class="touch dpad" id="touch" aria-hidden="true">
    <button data-k="up" class="up">▲</button>
    <button data-k="left" class="left">◀</button>
    <button data-k="fire" class="mid">NETZ</button>
    <button data-k="right" class="right">▶</button>
    <button data-k="down" class="down">▼</button>
  </div>
  <footer class="help">
    <p><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> Laufen &nbsp;·&nbsp; <kbd>Leertaste</kbd> Kescher schwingen / Start &nbsp;·&nbsp; <kbd>P</kbd> Pause &nbsp;·&nbsp; <kbd>M</kbd> Ton</p>
    <p>Fange möglichst viele Schmetterlinge. Finger weg von den Wespen!</p>
    <p><a href="index.html">← Zur Spielauswahl</a></p>
  </footer>
</main>
<script src="polyplay-core.js"></script>
<script>
(() => {
'use strict';
const { W, H, PAL, ctx, txt } = PP;
const TOP = 40, BOTTOM = 220;

/* ---------- Sprites ---------- */
const WING_OPEN = ['CC...CC', 'CCCKCCC', '.CCKCC.', 'CCCKCCC', 'CC...CC'];
const WING_SHUT = ['..C.C..', '..CKC..', '..CKC..', '..CKC..', '..C.C..'];
const TYPES = [
  { name: 'ZITRONENFALTER', color: '#fff060', pts: 10, speed: 26, flee: 0.1, w: 45 },
  { name: 'BLAEULING',      color: '#60a0ff', pts: 20, speed: 36, flee: 0.45, w: 30 },
  { name: 'ADMIRAL',        color: '#ff4040', pts: 30, speed: 48, flee: 0.75, w: 18 },
  { name: 'GOLDFALTER',     color: '#ffb000', pts: 100, speed: 75, flee: 1.1, w: 4 }
];
TYPES.forEach(t => { t.spr = [PP.makeSprite(WING_OPEN, { C: t.color }), PP.makeSprite(WING_SHUT, { C: t.color })]; });
const WASP = [
  PP.makeSprite(['.WW.WW.', '..WWW..', 'YKYKYKK', '.KYKYK.']),
  PP.makeSprite(['.......', '.WWWWW.', 'YKYKYKK', '.KYKYK.'])
];
const KID_TOP = ['..BBBB..', '.BBSSSS.', '.BSSKSK.', '..SSSSS.', '...SS...', '.RRRRRR.', 'S.RRRR.S', '..RRRR..', '..UUUU..'];
const KID = [
  PP.pair([...KID_TOP, '..S..S..', '..S..S..', '.KK..KK.'], { B: '#8a4a1a' }),
  PP.pair([...KID_TOP, '.S....S.', '.S....S.', 'KK....KK'], { B: '#8a4a1a' })
];

/* ---------- Hintergrund ---------- */
const BG = document.createElement('canvas');
BG.width = W; BG.height = H;
(() => {
  const b = BG.getContext('2d');
  b.fillStyle = '#60b0ff'; b.fillRect(0, 12, W, TOP - 12);
  b.fillStyle = '#ffffff';
  [[40, 20], [150, 26], [250, 18]].forEach(([x, y]) => { b.fillRect(x, y, 26, 6); b.fillRect(x + 6, y - 4, 14, 4); });
  b.fillStyle = '#2a8a2a'; b.fillRect(0, TOP - 4, W, BOTTOM - TOP + 4);
  b.fillStyle = '#227a22'; for (let y = TOP; y < BOTTOM; y += 8) b.fillRect(0, y, W, 1);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const flowerColors = ['#ffffff', '#ffe000', '#ff70b0', '#c060ff', '#ff3030'];
  for (let i = 0; i < 110; i++) {
    const x = Math.floor(rnd() * W), y = TOP + Math.floor(rnd() * (BOTTOM - TOP - 4));
    b.fillStyle = '#156015'; b.fillRect(x + 1, y + 2, 1, 3);
    b.fillStyle = flowerColors[Math.floor(rnd() * flowerColors.length)];
    b.fillRect(x, y + 1, 3, 1); b.fillRect(x + 1, y, 1, 3);
    b.fillStyle = '#ffe000'; b.fillRect(x + 1, y + 1, 1, 1);
  }
  b.fillStyle = '#3a2a10'; b.fillRect(0, BOTTOM, W, H - BOTTOM);
})();

/* ---------- Ton ---------- */
const sfx = {
  swish: () => PP.noise(0.08, 0.06),
  catch: pts => PP.melody(pts >= 100 ? [784, 988, 1175, 1568, 1976] : pts >= 30 ? [880, 1175, 1568] : [880, 1320], 0.07, 'square', 0.09),
  sting: () => { PP.tone(1200, 200, 0.4, 'sawtooth', 0.1); }
};

/* ---------- Zustand ---------- */
let kid, flies, wasps, popups, caught, stings, waspT;

function newFly() {
  const r = Math.random() * TYPES.reduce((s, t) => s + t.w, 0);
  let acc = 0, type = TYPES[0];
  for (const t of TYPES) { acc += t.w; if (r < acc) { type = t; break; } }
  const left = Math.random() < 0.5;
  return { type, x: left ? -14 : W, y: PP.rand(TOP + 10, BOTTOM - 30), vx: 0, vy: 0, turn: 0, t: Math.random() * 6 };
}
function newWasp() {
  return { x: Math.random() < 0.5 ? -14 : W, y: PP.rand(TOP + 10, BOTTOM - 30), t: 0, vx: 0, vy: 0 };
}
function reset() {
  kid = { x: W / 2 - 8, y: 130, face: 1, anim: 0, swing: 0, stun: 0 };
  flies = Array.from({ length: 7 }, newFly);
  flies.forEach(f => { f.x = PP.rand(10, W - 24); });
  wasps = [newWasp()];
  popups = []; caught = 0; stings = 0; waspT = 25;
}
reset();

function netPos() {
  // Kescher schwingt von oben nach vorne-unten
  const k = kid.swing > 0 ? 1 - kid.swing / 0.3 : 0;
  const a = kid.swing > 0 ? -1.4 + k * 2.0 : -1.0;
  const px = kid.x + (kid.face > 0 ? 15 : 1), py = kid.y + 13;
  return { px, py, x: px + Math.cos(a) * 18 * kid.face, y: py + Math.sin(a) * 18 };
}

function moveFlies(dt) {
  const cx = kid.x + 8, cy = kid.y + 12;
  for (const f of flies) {
    f.t += dt; f.turn -= dt;
    if (f.turn <= 0) {
      const a = Math.random() * Math.PI * 2, s = f.type.speed * PP.rand(0.6, 1.2);
      f.vx = Math.cos(a) * s; f.vy = Math.sin(a) * s * 0.7;
      f.turn = PP.rand(0.4, 1.4);
      // vom Rand weg ins Feld
      if (f.x < 10) f.vx = Math.abs(f.vx); if (f.x > W - 24) f.vx = -Math.abs(f.vx);
    }
    const dx = f.x + 7 - cx, dy = f.y + 5 - cy, d = Math.hypot(dx, dy);
    let ex = 0, ey = 0;
    if (d < 45 && f.type.flee > 0) { ex = dx / d * f.type.speed * f.type.flee; ey = dy / d * f.type.speed * f.type.flee; }
    f.x += (f.vx + ex) * dt;
    f.y += (f.vy + ey) * dt + Math.sin(f.t * 9) * 0.6;
    if (f.y < TOP) { f.y = TOP; f.vy = Math.abs(f.vy); }
    if (f.y > BOTTOM - 12) { f.y = BOTTOM - 12; f.vy = -Math.abs(f.vy); }
    if (f.x < -16 || f.x > W + 2) { if (f.t > 3) Object.assign(f, newFly()); }
  }
}

function moveWasps(dt, chase) {
  const cx = kid.x + 8, cy = kid.y + 10;
  for (const w of wasps) {
    w.t += dt;
    const dx = cx - w.x - 7, dy = cy - w.y - 4, d = Math.hypot(dx, dy) || 1;
    const s = chase && kid.stun <= 0 ? 34 : 20;
    w.vx += (dx / d * s - w.vx) * dt * 1.5 + PP.rand(-60, 60) * dt;
    w.vy += (dy / d * s - w.vy) * dt * 1.5 + PP.rand(-60, 60) * dt;
    w.x += w.vx * dt; w.y += w.vy * dt + Math.sin(w.t * 14) * 0.5;
    w.y = PP.clamp(w.y, TOP, BOTTOM - 10);
  }
}

function sting(g, w, msg) {
  kid.stun = 1.5; stings++;
  g.score = Math.max(0, g.score - 20);
  popups.push({ x: kid.x + 8, y: kid.y - 6, s: msg, c: PAL.R, t: 0 });
  sfx.sting();
  // Wespe fliegt weg
  w.x = Math.random() < 0.5 ? -20 : W + 6; w.y = PP.rand(TOP, BOTTOM - 20);
}

PP.arcade({
  recordKey: 'polyplay-schmetterlinge-rekord',
  time: 90,
  reset,
  attractReset: reset,
  attractUpdate(dt) { moveFlies(dt); moveWasps(dt, false); },
  overUpdate(dt) { moveFlies(dt); },
  update(dt, g) {
    const K = PP.keys, v = 105;
    if (kid.stun > 0) kid.stun -= dt;
    else {
      let mx = 0, my = 0;
      if (K.left) { mx -= 1; kid.face = -1; }
      if (K.right) { mx += 1; kid.face = 1; }
      if (K.up) my -= 1;
      if (K.down) my += 1;
      kid.x = PP.clamp(kid.x + mx * v * dt, 0, W - 16);
      kid.y = PP.clamp(kid.y + my * v * dt, TOP - 6, BOTTOM - 24);
      if (mx || my) kid.anim += dt;
      if (PP.pressed('fire') && kid.swing <= 0) { kid.swing = 0.3; sfx.swish(); }
    }
    PP.pressed('fire');

    moveFlies(dt);
    waspT -= dt;
    if (waspT <= 0 && wasps.length < 4) { wasps.push(newWasp()); waspT = 25; }
    moveWasps(dt, true);

    if (kid.swing > 0) {
      kid.swing -= dt;
      const n = netPos();
      for (const f of flies) {
        if (Math.hypot(f.x + 7 - n.x, f.y + 5 - n.y) < 10) {
          g.score += f.type.pts; caught++;
          popups.push({ x: f.x + 7, y: f.y - 4, s: String(f.type.pts), c: '#fff', t: 0 });
          sfx.catch(f.type.pts);
          Object.assign(f, newFly());
        }
      }
      for (const w of wasps) if (Math.hypot(w.x + 7 - n.x, w.y + 4 - n.y) < 9) sting(g, w, 'AUA! -20');
    }
    if (kid.stun <= 0) {
      for (const w of wasps) {
        if (Math.abs(w.x + 7 - (kid.x + 8)) < 9 && Math.abs(w.y + 4 - (kid.y + 12)) < 12) { sting(g, w, 'AUA! -20'); break; }
      }
    }
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 1);
  },
  draw(g) {
    ctx.drawImage(BG, 0, 0);
    drawFlies();
    if (g.state === 'play') {
      drawKid();
      drawWasps();
      for (const p of popups) txt(p.s, p.x, p.y - p.t * 14, p.c, 8, 'center');
      txt('GEFANGEN ' + caught, 4, 228, PAL.g);
    } else drawWasps();
  },
  attract() {
    ctx.drawImage(BG, 0, 0);
    drawFlies(); drawWasps();
    PP.dim(0.6, 12, 210);
    txt('SCHMETTERLINGE', W / 2, 24, PAL.Y, 16, 'center');
    TYPES.forEach((t, i) => {
      const y = 56 + i * 22;
      PP.draw(t.spr[Math.floor(PP.time * 6 + i) % 2], 50, y, 2);
      txt(t.name, 76, y + 2, '#fff');
      txt(String(t.pts).padStart(3, ' '), 232, y + 2, PAL.Y);
    });
    PP.draw(WASP[Math.floor(PP.time * 10) % 2], 50, 146, 2);
    txt('WESPE', 76, 148, PAL.R);
    txt('-20', 232, 148, PAL.R);
    txt('KESCHER SCHWINGEN MIT LEERTASTE', W / 2, 180, PAL.g, 8, 'center');
  },
  overLines: () => [['GEFANGEN ' + PP.pad(caught, 3)], ['STICHE   ' + PP.pad(stings, 3), PAL.R]]
});

function drawFlies() {
  for (const f of flies) PP.draw(f.type.spr[Math.floor(f.t * 8) % 2], f.x, f.y, 2);
}
function drawWasps() {
  for (const w of wasps) {
    const img = WASP[Math.floor(w.t * 16) % 2];
    if (w.vx < 0) { ctx.save(); ctx.translate(Math.round(w.x) + 14, Math.round(w.y)); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, 14, 8); ctx.restore(); }
    else PP.draw(img, w.x, w.y, 2);
  }
}
function drawKid() {
  if (kid.stun > 0 && PP.blinkOn(0.15, 0.5)) return;
  const s = KID[Math.floor(kid.anim * 8) % 2];
  PP.draw(kid.face > 0 ? s.r : s.l, kid.x, kid.y, 2);
  const n = netPos();
  // Stiel
  ctx.strokeStyle = '#c08040'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(n.px, n.py); ctx.lineTo(n.x, n.y); ctx.stroke();
  // Netzring
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    ctx.fillRect(Math.round(n.x + Math.cos(a) * 6), Math.round(n.y + Math.sin(a) * 6), 1, 1);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(n.x, n.y, 5, 0, Math.PI * 2); ctx.fill();
}
})();
</script>
</body>
</html>
